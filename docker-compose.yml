version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: smartledger-postgres
    environment:
      POSTGRES_DB: smartledger
      POSTGRES_USER: smartledger
      POSTGRES_PASSWORD: smartledger
    ports:
      - "5432:5432"
    volumes:
      - smartledger_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartledger"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  smartledger_pg_data:
