server:
  port: ${SERVER_PORT:3000}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartledger}
    username: ${SPRING_DATASOURCE_USERNAME:smartledger}
    password: ${SPRING_DATASOURCE_PASSWORD:smartledger}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-chars-minimum}
  expiry: ${JWT_EXPIRY:86400000}

wispr:
  key: ${WISPR_KEY:}
  base-url: ${WISPR_BASE_URL:https://api.wispr.ai}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
